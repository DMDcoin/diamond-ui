services:
  diamond-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_CHAINID=${NEXT_PUBLIC_CHAINID}
      - NEXT_PUBLIC_CHAIN_NAME=${NEXT_PUBLIC_CHAIN_NAME}
      - NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_EXPLORER_URL=${NEXT_PUBLIC_EXPLORER_URL}
      - NEXT_PUBLIC_CLAIMING_CONTRACT_ADDRESS=${NEXT_PUBLIC_CLAIMING_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_AGGREGATOR_CONTRACT_ADDRESS=${NEXT_PUBLIC_AGGREGATOR_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_DAO_CONTRACT_ADDRESS=${NEXT_PUBLIC_DAO_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_LOW_MAJORITY_CONTRACT_ADDRESS=${NEXT_PUBLIC_LOW_MAJORITY_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_DIAMOND_REGISTRY_CONTRACT_ADDRESS=${NEXT_PUBLIC_DIAMOND_REGISTRY_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_WC_PROJECT_ID=${NEXT_PUBLIC_WC_PROJECT_ID}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_REPORT_EMAIL=${NEXT_PUBLIC_REPORT_EMAIL}
      - NEXT_PUBLIC_PORT=${NEXT_PUBLIC_PORT:-3000}
      - NEXT_PUBLIC_DEBUG_TX=${NEXT_PUBLIC_DEBUG_TX:-0}
      - NEXT_PUBLIC_DEBUG_TX_LEVEL=${NEXT_PUBLIC_DEBUG_TX_LEVEL:-0}
      
      # Server-side only variables
      - DB_API_BASE_URL=${DB_API_BASE_URL}
      - DB_API_TOKEN=${DB_API_TOKEN}
      - SITE_URL=${SITE_URL}
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/config', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
